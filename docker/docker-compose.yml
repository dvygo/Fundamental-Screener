name: fundamental-screener

# Storage + audit layer for the screener.
#   minio       S3-compatible object store (the buckets live here)
#   minio-init  one-shot: creates buckets, turns on versioning, locks raw/ WORM
# Delta tables are written into the delta/ bucket and queried with DuckDB in
# process (src/lake.py) — no Trino/Spark cluster at this scale.

services:
  minio:
    image: minio/minio:latest
    container_name: fs-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Provisions buckets once MinIO is up, then exits.
  #  - raw    : Object-Lock ON at creation (WORM) + versioning + a default
  #             COMPLIANCE retention. Bhavcopies dropped here cannot be
  #             overwritten or deleted until the window elapses = tamper-evidence.
  #  - delta  : versioning ON (Delta keeps its own log; versioning is belt-and-braces)
  minio-init:
    image: minio/mc:latest
    container_name: fs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Days source drops stay immutable. Override in .env.
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-3650}
    entrypoint: >
      /bin/sh -c '
      set -e;
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      echo "-> raw (WORM, object-lock)";
      mc mb --with-lock --ignore-existing local/raw;
      mc version enable local/raw;
      mc retention set --default COMPLIANCE "$${RAW_RETENTION_DAYS}d" local/raw;
      echo "-> delta (versioned)";
      mc mb --ignore-existing local/delta;
      mc version enable local/delta;
      echo "buckets ready:"; mc ls local;
      '

volumes:
  minio-data:
